name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-guard:
    name: Vendored schema guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Block hand-edits to vendored schemas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          flagged=0

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- schemas/)"
          if [ -n "$changed" ]; then
            flagged=1
            echo "PR modifies vendored schema file(s):"
            echo "$changed"
          fi

          # Best-effort cross-check against the companion B3MatchingPlatform
          # repo, which vendors the same entrypoint schema and is kept in
          # lock-step per README.md. Network/availability issues here only
          # warn (they must not make an unrelated outage block every PR);
          # an actual content mismatch is treated the same as a local edit.
          # Scoped to files this PR actually touched under schemas/ — PRs
          # that don't touch schemas/ must not be blocked by pre-existing
          # drift between the two repos that predates this PR. Iterated
          # line-by-line (not word-split) so filenames with spaces survive.
          #
          # NOTE: because this only runs for files already in $changed, it
          # can never independently flip flagged from 0 to 1 — flagged is
          # already 1 whenever the loop has anything to iterate. Its value
          # is diagnostic: confirming, for a change a maintainer is about
          # to label schema-upgrade, whether the new content is byte-
          # identical to the trusted upstream copy (vs. an edit that
          # merely resembles the official schema). It intentionally does
          # not gate PRs that leave schemas/ untouched, even if drift
          # exists there already.
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in schemas/*.xml) ;; *) continue ;; esac
            if [ ! -f "$f" ]; then
              # Deleted by this PR; already caught by the local diff check
              # above (flagged=1), nothing to cross-check against upstream.
              continue
            fi
            name="$(basename "$f")"
            url="https://raw.githubusercontent.com/pedrosakuma/B3MatchingPlatform/main/schemas/$name"
            if remote_sha="$(curl -fsSL --connect-timeout 5 --max-time 15 "$url" 2>/dev/null | sha256sum | awk '{print $1}')"; then
              local_sha="$(sha256sum "$f" | awk '{print $1}')"
              if [ "$remote_sha" != "$local_sha" ]; then
                flagged=1
                echo "$f (sha256 $local_sha) diverges from B3MatchingPlatform's vendored copy (sha256 $remote_sha)."
              fi
            else
              echo "::warning::Could not fetch $url to cross-check vendored schema fidelity; skipping cross-repo check for $name."
            fi
          done <<< "$changed"

          if [ "$flagged" = 0 ]; then
            echo "No changes under schemas/ and no drift from the companion repo. OK."
            exit 0
          fi

          has_label="$(jq -r '([.pull_request.labels[].name] | index("schema-upgrade")) != null' "$GITHUB_EVENT_PATH")"
          if [ "$has_label" != "true" ]; then
            echo "::error::Files under schemas/ are vendored (see README.md) and must not be hand-edited. If this is an intentional, reviewed schema upgrade, add the 'schema-upgrade' label to this PR to acknowledge and unblock this check."
            exit 1
          fi
          echo "PR is labeled 'schema-upgrade' — allowing vendored schema change."

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Use the PR head SHA (not the synthetic merge commit) so the SHA
          # SourceLink embeds is reachable from raw.githubusercontent.com.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore SbeB3EntryPointClient.slnx

      - name: Build (Release, warnings-as-errors)
        run: dotnet build SbeB3EntryPointClient.slnx --no-restore -c Release

      - name: Test
        run: >
          dotnet test SbeB3EntryPointClient.slnx
          --no-build -c Release
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Conformance (in-process FIXP peer)
        env:
          ENTRYPOINT_TESTPEER: "1"
        run: >
          dotnet test tests/B3.EntryPoint.Conformance/B3.EntryPoint.Conformance.csproj
          --no-build -c Release
          --logger "trx;LogFileName=conformance-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Pack (validation)
        run: dotnet pack SbeB3EntryPointClient.slnx --no-build -c Release -o ./nupkgs

      # SourceLink gate: every .snupkg's PDB must contain GitHub URLs that
      # resolve (HTTP 200) and whose content checksum matches the PDB hash.
      - name: Install sourcelink tool
        run: dotnet tool install --global sourcelink

      - name: SourceLink test (snupkgs)
        run: |
          set -euo pipefail
          mkdir -p ./snupkg-extract
          shopt -s nullglob globstar
          for snupkg in ./nupkgs/*.snupkg; do
            name=$(basename "$snupkg" .snupkg)
            dest="./snupkg-extract/$name"
            mkdir -p "$dest"
            unzip -q -o "$snupkg" -d "$dest"
            for pdb in "$dest"/lib/**/*.pdb; do
              echo "::group::sourcelink test $pdb"
              sourcelink test "$pdb"
              echo "::endgroup::"
            done
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*
          if-no-files-found: ignore
          retention-days: 14

  format:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK (pinned by global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (needed by dotnet format)
        run: dotnet restore SbeB3EntryPointClient.slnx

      - name: dotnet format --verify-no-changes
        run: dotnet format SbeB3EntryPointClient.slnx --verify-no-changes --no-restore --severity warn
